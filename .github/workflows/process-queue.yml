name: Payment Recovery & Queue Processing

on:
  schedule:
    # Every 5 minutes, offset from the hour (GitHub may delay scheduled runs under load)
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

concurrency:
  group: process-queue
  cancel-in-progress: false

jobs:
  process-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger queue processing endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::SITE_URL or CRON_SECRET repository secret is missing."
            exit 1
          fi

          # Strip any trailing slash and default to https
          BASE_URL="${SITE_URL%/}"
          if [[ ! "$BASE_URL" =~ ^https?:// ]]; then
            BASE_URL="https://$BASE_URL"
          fi

          echo "Invoking ${BASE_URL}/api/cron/process-queue ..."
          HTTP_RESPONSE=$(curl -s -S -w "\n%{http_code}" "${BASE_URL}/api/cron/process-queue" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: github-actions-process-queue" \
            --connect-timeout 10 \
            --max-time 120)

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1)

          echo "Response Status: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Queue endpoint returned HTTP $HTTP_STATUS: $HTTP_BODY"
            exit 1
          fi

          if ! echo "$HTTP_BODY" | jq -e '.success == true' >/dev/null; then
            echo "::error::Queue processing reported failure."
            exit 1
          fi
